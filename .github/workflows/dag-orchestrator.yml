name: Jafly Compatibility Dispatcher

on:
  workflow_dispatch:
    inputs:
      trigger-repo:
        description: 'Jafly or one of its former Java source repositories'
        required: true
        type: string
      build-all:
        description: 'Compatibility input; the complete Maven reactor always runs'
        required: false
        default: false
        type: boolean
      mode:
        description: 'Dispatch CI or the exact tagged release workflow'
        required: false
        default: 'ci'
        type: choice
        options:
          - ci
          - release
      release-tag:
        description: 'Existing final tag for release mode, such as v26.10.17'
        required: false
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch Jafly; destination workflow owns validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test compatibility routing
        run: python3 -m unittest discover -s tests
      - name: Dispatch one reactor
        env:
          GH_TOKEN: ${{ secrets.ORG_DISPATCH_TOKEN }}
          TRIGGER_REPO: ${{ inputs.trigger-repo }}
          MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: >-
          python3 scripts/dispatch_jafly.py
          --trigger-repo "$TRIGGER_REPO"
          --mode "$MODE"
          --release-tag "$RELEASE_TAG"
