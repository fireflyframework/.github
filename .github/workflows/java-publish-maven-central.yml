name: Java Publish to Maven Central

# Decoupled Maven Central publishing.
#
# Why a separate workflow:
#   - Sonatype Central Portal validation can take 20-40 minutes after upload,
#     and the central-publishing-maven-plugin polls until validation completes.
#     The plugin's default poll timeout is shorter than Portal's actual SLA,
#     so deploys frequently fail with "Polling for <id> timed out" even though
#     the bundle was uploaded successfully.
#   - When Maven Central was a job in the same workflow as GitHub Packages,
#     a Maven Central timeout caused the whole workflow to show red, hid the
#     successful GH Packages publish, and blocked the GitHub Release page.
#   - Decoupling lets the GH Packages publish + Release page run reliably while
#     Maven Central retries independently (workflow_dispatch) on its own time.
#
# Triggers:
#   - workflow_call from per-repo wrapper (typically on tag push v*)
#   - workflow_dispatch from the per-repo wrapper (manual retry / scheduled)

on:
  workflow_call:
    inputs:
      java-version:
        description: 'Java version to use'
        required: false
        type: string
        default: '25'
      wait-max-time:
        description: 'Sonatype Central polling wait time in seconds (default 3600 = 60min)'
        required: false
        type: string
        default: '3600'

jobs:
  maven-central:
    runs-on: ubuntu-latest
    concurrency:
      group: release-mc-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ inputs.java-version }}
          distribution: temurin
          cache: maven

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml << 'EOF'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
              <server>
                <id>github</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
            <profiles>
              <profile>
                <id>github-packages</id>
                <repositories>
                  <repository>
                    <id>github</id>
                    <url>https://maven.pkg.github.com/fireflyframework/fireflyframework-parent</url>
                    <snapshots><enabled>true</enabled></snapshots>
                    <releases><enabled>true</enabled></releases>
                  </repository>
                </repositories>
              </profile>
            </profiles>
            <activeProfiles>
              <activeProfile>github-packages</activeProfile>
            </activeProfiles>
          </settings>
          EOF

      - name: Import GPG private key
        run: |
          echo "$GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Clear cached parent POM
        run: rm -rf ~/.m2/repository/org/fireflyframework

      - name: Check existing Maven Central publication
        id: central-check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RESPONSE=$(curl -sf -u "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" \
            "https://central.sonatype.com/api/v1/publisher/published?namespace=org.fireflyframework&version=${VERSION}" 2>/dev/null || echo "")
          if echo "$RESPONSE" | grep -qi "published"; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Version ${VERSION} already published on Maven Central — skipping deploy"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Maven Central
        if: steps.central-check.outputs.skip != 'true'
        run: |
          set -o pipefail
          # waitMaxTime drives how long central-publishing-maven-plugin polls for
          # Sonatype Portal validation after upload. Default plugin value is
          # short (10 min); Portal SLA is up to 40 min for first-time versions.
          mvn -B -U -fae deploy -P release,maven-central -DskipTests \
            -Dcentral.waitMaxTime=${{ inputs.wait-max-time }} \
            2>&1 | tee /tmp/mvn-central.log || {
              # 409 / duplicate / already published == benign (artifact is immutable)
              NON_DUP=$(grep -i "Failed to deploy\|Failed to execute.*deploy" /tmp/mvn-central.log | grep -viE "409|already published|already exists|duplicate|content already exists" || true)
              if grep -qiE "status code: 409|already published|already exists|duplicate|content already exists" /tmp/mvn-central.log && [ -z "$NON_DUP" ]; then
                echo "::warning::Artifact version already exists on Maven Central (immutable) — this is expected for re-releases"
                exit 0
              fi
              # Polling timeout: upload may have succeeded; Sonatype just hasn't
              # validated yet. Treat as soft failure so the workflow's run history
              # marks it for retry instead of red across the whole release.
              if grep -qi "timed out before the deployment completed\|Polling for .* timed out" /tmp/mvn-central.log; then
                echo "::warning::Maven Central polling timed out — bundle is uploaded; re-run this workflow to poll again"
                exit 0
              fi
              echo "::error::Maven Central deploy failed"
              cat /tmp/mvn-central.log | grep -A2 "ERROR\|Failed" | tail -30
              exit 1
            }
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Verify Maven Central publication
        if: steps.central-check.outputs.skip != 'true'
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          VERSION=${{ steps.central-check.outputs.version }}
          # Best-effort: poll Sonatype's published API for up to 5 more minutes
          # in case the deploy step accepted a polling timeout. This is informational
          # only — does not fail the workflow.
          for I in 1 2 3 4 5; do
            RESPONSE=$(curl -sf -u "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" \
              "https://central.sonatype.com/api/v1/publisher/published?namespace=org.fireflyframework&version=${VERSION}" 2>/dev/null || echo "")
            if echo "$RESPONSE" | grep -qi "published"; then
              echo "::notice::Verified ${VERSION} published on Maven Central"
              exit 0
            fi
            sleep 60
          done
          echo "::warning::Could not confirm ${VERSION} on Maven Central after 5 minutes — Sonatype may still be validating"
